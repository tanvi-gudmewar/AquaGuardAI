

server.port=${PORT:8080}

spring.application.name=aquaguard-ai

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/aquaguard}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

spring.jackson.serialization.write-dates-as-timestamps=false

management.endpoints.web.exposure.include=health,info

app.cors.allowed-origin=${FRONTEND_ORIGIN:http://localhost:5173}
app.simulation.interval-ms=${SIMULATION_INTERVAL_MS:5000}

